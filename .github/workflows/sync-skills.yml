name: Sync Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/marketplace.json'

jobs:
  sync:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Sync skills
        run: node .github/scripts/sync-skills.js

      # main is a protected branch (PRs required), so this can no longer commit
      # straight to it — open a PR instead and let it merge like any other change.
      - name: Open sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync skills with marketplace.json, plugin.json, and README"
          committer: "Coreybot <coreybot+github-actions[bot]@users.noreply.github.com>"
          author: "Coreybot <coreybot+github-actions[bot]@users.noreply.github.com>"
          branch: chore/sync-skills
          delete-branch: true
          title: "chore: sync skills with marketplace.json, plugin.json, and README"
          body: "Auto-generated by the Sync Skills workflow — regenerates `.claude-plugin/marketplace.json`, `.claude-plugin/plugin.json`, and the README skills table from the current `skills/` directory."
          add-paths: |
            .claude-plugin/marketplace.json
            .claude-plugin/plugin.json
            README.md
